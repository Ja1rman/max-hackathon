# DATA-API.yaml — сценарий проверки API решения «За столом».
# Проверки выполняются по порядку: значения из ответов (save) используются в следующих запросах
# как {{имя}}; {{data.*}} берётся из файла test_data. Каждый прогон начинается с нового
# изолированного демо-пространства, поэтому проверки можно повторять, реальные данные не затрагиваются.
# Автоматический прогон: node scripts/api-check.mjs [base_url]  (npm run api:check)

config_version: "1.0"                     # версия схемы этого файла

solution:
  name: За столом                         # наименование решения
  team_id: t266                           # идентификатор команды (бот @t266_hakaton_max_bot)
  description: Банкет с выбором каждого гостя — мини-приложение MAX для организатора, гостей и ресторана.

base_url: https://mail.lonelycraft.ru/banquet/api/v1   # все path ниже — относительно этого адреса
openapi: ./openapi.yaml                   # OpenAPI 3.1; опубликован по адресу https://mail.lonelycraft.ru/banquet/openapi.yaml
swagger_ui: https://mail.lonelycraft.ru/banquet/swagger/
test_data: ./fixtures/api-checks.json

auth:
  type: bearer
  header: Authorization
  format: "Bearer <token>"
  note: >-
    Живой вход выполняется только из MAX (POST /auth/max с подписанным initData). Для проверки
    используются тестовые учётные записи демо-режима: POST /auth/demo выдаёт токен роли в
    изолированном пространстве; sandbox из первого ответа подключает остальные роли к тому же
    пространству. Токен действует 24 часа.

accounts:                                 # тестовые учётные записи по ролям
  - role: organizer
    purpose: Организатор мероприятия — создаёт и настраивает банкет, утверждает заказ.
    obtain: 'POST /auth/demo {"role":"organizer"} → token, sandbox'
  - role: guest
    purpose: Гость мероприятия — присоединяется по приглашению, выбирает блюда и место.
    obtain: 'POST /auth/demo {"role":"guest","sandbox":"<sandbox>"} → token'
  - role: restaurant
    purpose: Администратор ресторана — меню, кухня, выгрузки, доступы. Только в своём демо-пространстве.
    obtain: 'POST /auth/demo {"role":"restaurant","sandbox":"<sandbox>"} → token'
  - role: anonymous
    purpose: Без токена — публичные методы и проверка отказа в доступе.

checks:                                   # обязательные проверки основной функциональности
  # --- Доступность и вход ---
  - id: health
    name: Сервис и база данных доступны
    required: true
    method: GET
    path: /healthz
    role: anonymous
    params: {}
    expected_status: [200]
    expected_response:
      content_type: application/json
      type: object
      required_fields: [status]
      values: { status: ok }

  - id: config
    name: Публичная конфигурация клиента
    required: true
    method: GET
    path: /config
    role: anonymous
    params: {}
    expected_status: [200]
    expected_response:
      content_type: application/json
      type: object
      required_fields: [demoEnabled, maxConfigured, botUsername]
      values: { demoEnabled: true }

  - id: login_organizer
    name: Тестовая учётная запись организатора
    required: true
    method: POST
    path: /auth/demo
    role: anonymous
    params:
      headers: { Content-Type: application/json }
      body: { role: organizer }
    expected_status: [200]
    expected_response:
      content_type: application/json
      type: object
      required_fields: [token, sandbox, user.id, user.role, user.access]
      values: { user.role: organizer }
    save: { organizerToken: $.token, sandbox: $.sandbox }

  - id: login_guest
    name: Тестовая учётная запись гостя (то же пространство)
    required: true
    method: POST
    path: /auth/demo
    role: anonymous
    params:
      headers: { Content-Type: application/json }
      body: { role: guest, sandbox: "{{sandbox}}" }
    expected_status: [200]
    expected_response:
      content_type: application/json
      type: object
      required_fields: [token, user.id]
      values: { user.role: guest }
    save: { guestToken: $.token }

  - id: login_admin
    name: Тестовая учётная запись администратора ресторана
    required: true
    method: POST
    path: /auth/demo
    role: anonymous
    params:
      headers: { Content-Type: application/json }
      body: { role: restaurant, sandbox: "{{sandbox}}" }
    expected_status: [200]
    expected_response:
      content_type: application/json
      type: object
      required_fields: [token, user.id, user.superAdmin]
      values: { user.role: restaurant }
    save: { adminToken: $.token }

  - id: me
    name: Профиль текущего пользователя
    required: true
    method: GET
    path: /me
    role: organizer
    params:
      headers: { Authorization: "Bearer {{organizerToken}}" }
    expected_status: [200]
    expected_response:
      content_type: application/json
      type: object
      required_fields: [id, name, role, demo, phoneVerified, notificationsEnabled, access]
      values: { role: organizer, demo: true }

  - id: me_unauthorized
    name: Без токена защищённые методы недоступны
    required: true
    method: GET
    path: /me
    role: anonymous
    params: {}
    expected_status: [401]
    expected_response:
      content_type: application/json
      type: object
      required_fields: [error]

  # --- Организатор: создание и настройка мероприятия ---
  - id: restaurants
    name: Рестораны и меню, доступные организатору
    required: true
    method: GET
    path: /restaurants
    role: organizer
    params:
      headers: { Authorization: "Bearer {{organizerToken}}" }
    expected_status: [200]
    expected_response:
      content_type: application/json
      type: array
      min_items: 1
      required_fields: [id, name, address, access, menu, "menu[0].id", "menu[0].price", "menu[0].category", "menu[0].nutrition.kcal", "menu[0].allergens"]
    save: { restaurantId: "$[0].id" }

  - id: event_create
    name: Организатор создаёт мероприятие с бюджетом на гостя
    required: true
    method: POST
    path: /events
    role: organizer
    params:
      headers: { Authorization: "Bearer {{organizerToken}}" }
      body:
        restaurantId: "{{restaurantId}}"
        title: "{{data.event.title}}"
        date: "{{data.event.date}}"
        deadline: "{{data.event.deadline}}"
        expectedGuests: "{{data.event.expectedGuests}}"
        foodBudget: "{{data.event.foodBudget}}"
        drinkBudget: "{{data.event.drinkBudget}}"
    expected_status: [201]
    expected_response:
      content_type: application/json
      type: object
      required_fields: [id, title, date, deadline, status, inviteCode, revision, foodBudget, drinkBudget, canManage]
      values: { status: collecting, canManage: true, foodBudget: 300000 }
    save: { eventId: $.id, inviteCode: $.inviteCode }

  - id: event_create_forbidden_for_guest
    name: Гость не может создать мероприятие
    required: true
    method: POST
    path: /events
    role: guest
    params:
      headers: { Authorization: "Bearer {{guestToken}}" }
      body:
        restaurantId: "{{restaurantId}}"
        title: "{{data.event.title}}"
        date: "{{data.event.date}}"
        deadline: "{{data.event.deadline}}"
        expectedGuests: 5
    expected_status: [403]
    expected_response:
      content_type: application/json
      type: object
      required_fields: [error]

  - id: event_detail_organizer
    name: Карточка мероприятия для организатора (меню, гости, сводка, рассадка)
    required: true
    method: GET
    path: /events/{eventId}
    role: organizer
    params:
      path: { eventId: "{{eventId}}" }
      headers: { Authorization: "Bearer {{organizerToken}}" }
    expected_status: [200]
    expected_response:
      content_type: application/json
      type: object
      required_fields: [event.id, event.revision, menu, guests, summary, shared, seating.mode, invitedGuests, inviteUrl]
    save:
      revision: $.event.revision
      snackId: "$.menu[?(@.category=='Закуски')].id"
      mainId: "$.menu[?(@.category=='Горячее')].id"
      drinkId: "$.menu[?(@.category=='Напитки')].id"

  - id: event_update
    name: Организатор меняет параметры и бюджет
    required: true
    method: PATCH
    path: /events/{eventId}
    role: organizer
    params:
      path: { eventId: "{{eventId}}" }
      headers: { Authorization: "Bearer {{organizerToken}}" }
      body:
        expectedRevision: "{{revision}}"
        title: "{{data.eventUpdate.title}}"
        expectedGuests: "{{data.eventUpdate.expectedGuests}}"
        foodBudget: "{{data.eventUpdate.foodBudget}}"
    expected_status: [200]
    expected_response:
      content_type: application/json
      type: object
      required_fields: [id, title, revision, foodBudget]
      values: { title: "{{data.eventUpdate.title}}", foodBudget: 250000 }

  - id: invite_guest
    name: Организатор добавляет гостя в список приглашённых
    required: true
    method: POST
    path: /events/{eventId}/guests
    role: organizer
    params:
      path: { eventId: "{{eventId}}" }
      headers: { Authorization: "Bearer {{organizerToken}}" }
      body: "{{data.invitedGuest}}"
    expected_status: [201]
    expected_response:
      content_type: application/json
      type: object
      required_fields: [id, name, phone, joined]
      values: { phone: "79990001234", joined: false }

  - id: shared_table
    name: Организатор выбирает закуски на общий стол
    required: true
    method: PUT
    path: /events/{eventId}/shared
    role: organizer
    params:
      path: { eventId: "{{eventId}}" }
      headers: { Authorization: "Bearer {{organizerToken}}" }
      body:
        items:
          - { menuItemId: "{{snackId}}", quantity: "{{data.sharedQuantity}}" }
    expected_status: [200]
    expected_response:
      content_type: application/json
      type: object
      required_fields: [items, "items[0].menuItemId", "items[0].quantity", "items[0].total"]

  - id: seating_layout
    name: Организатор задаёт схему рассадки
    required: true
    method: PUT
    path: /events/{eventId}/seating
    role: organizer
    params:
      path: { eventId: "{{eventId}}" }
      headers: { Authorization: "Bearer {{organizerToken}}" }
      body: "{{data.seating}}"
    expected_status: [200]
    expected_response:
      content_type: application/json
      type: object
      required_fields: [mode, layout.tables, seatCount, occupied, names]
      values: { mode: choice, seatCount: 10 }

  # --- Гость: приглашение, выбор блюд и места ---
  - id: invite_preview
    name: Публичная страница приглашения
    required: true
    method: GET
    path: /invites/{code}
    role: anonymous
    params:
      path: { code: "{{inviteCode}}" }
    expected_status: [200]
    expected_response:
      content_type: application/json
      type: object
      required_fields: [event.id, event.title, event.date, menu]

  - id: guest_join
    name: Гость присоединяется по приглашению
    required: true
    method: POST
    path: /invites/{code}/join
    role: guest
    params:
      path: { code: "{{inviteCode}}" }
      headers: { Authorization: "Bearer {{guestToken}}" }
    expected_status: [200]
    expected_response:
      content_type: application/json
      type: object
      required_fields: [eventId]
      values: { eventId: "{{eventId}}" }

  - id: event_detail_guest
    name: Гость видит меню, общий стол и свой бюджет
    required: true
    method: GET
    path: /events/{eventId}
    role: guest
    params:
      path: { eventId: "{{eventId}}" }
      headers: { Authorization: "Bearer {{guestToken}}" }
    expected_status: [200]
    expected_response:
      content_type: application/json
      type: object
      required_fields: [event.foodBudget, event.drinkBudget, menu, shared, selection, canSelect, seating.names]
      values: { canSelect: true, event.canManage: false }

  - id: guest_selection_over_budget
    name: Выбор дороже бюджета отклоняется
    required: true
    method: PUT
    path: /events/{eventId}/selection
    role: guest
    params:
      path: { eventId: "{{eventId}}" }
      headers: { Authorization: "Bearer {{guestToken}}" }
      body:
        items:
          - { menuItemId: "{{mainId}}", quantity: "{{data.overBudgetQuantity}}" }
    expected_status: [409]
    expected_response:
      content_type: application/json
      type: object
      required_fields: [error]

  - id: guest_selection_shared_rejected
    name: Позицию общего стола нельзя заказать самому
    required: true
    method: PUT
    path: /events/{eventId}/selection
    role: guest
    params:
      path: { eventId: "{{eventId}}" }
      headers: { Authorization: "Bearer {{guestToken}}" }
      body:
        items:
          - { menuItemId: "{{snackId}}", quantity: 1 }
    expected_status: [400]
    expected_response:
      content_type: application/json
      type: object
      required_fields: [error]

  - id: guest_selection
    name: Гость отправляет заказ организатору
    required: true
    method: PUT
    path: /events/{eventId}/selection
    role: guest
    params:
      path: { eventId: "{{eventId}}" }
      headers: { Authorization: "Bearer {{guestToken}}" }
      body:
        items:
          - { menuItemId: "{{mainId}}", quantity: "{{data.selectionQuantity}}" }
          - { menuItemId: "{{drinkId}}", quantity: 1 }
        notes: "{{data.selectionNotes}}"
    expected_status: [200]
    expected_response:
      content_type: application/json
      type: object
      required_fields: [success, total]
      values: { success: true }

  - id: guest_seat
    name: Гость выбирает место
    required: true
    method: PUT
    path: /events/{eventId}/seat
    role: guest
    params:
      path: { eventId: "{{eventId}}" }
      headers: { Authorization: "Bearer {{guestToken}}" }
      body: { seatId: "{{data.seatId}}" }
    expected_status: [200]
    expected_response:
      content_type: application/json
      type: object
      required_fields: [mySeat, occupied, names]
      values: { mySeat: "{{data.seatId}}" }

  # --- Организатор: согласование ---
  - id: event_summary
    name: Организатор видит заказы гостей и сумму
    required: true
    method: GET
    path: /events/{eventId}
    role: organizer
    params:
      path: { eventId: "{{eventId}}" }
      headers: { Authorization: "Bearer {{organizerToken}}" }
    expected_status: [200]
    expected_response:
      content_type: application/json
      type: object
      required_fields: [event.total, event.responded, guests, "guests[0].items", summary, "summary[0].quantity"]
    save: { revision: $.event.revision }

  - id: approve_forbidden_for_guest
    name: Гость не может утвердить заказ
    required: true
    method: POST
    path: /events/{eventId}/approve
    role: guest
    params:
      path: { eventId: "{{eventId}}" }
      headers: { Authorization: "Bearer {{guestToken}}" }
      body: { expectedRevision: "{{revision}}" }
    expected_status: [403]
    expected_response:
      content_type: application/json
      type: object
      required_fields: [error]

  - id: approve
    name: Организатор утверждает заказ
    required: true
    method: POST
    path: /events/{eventId}/approve
    role: organizer
    params:
      path: { eventId: "{{eventId}}" }
      headers: { Authorization: "Bearer {{organizerToken}}" }
      body: { expectedRevision: "{{revision}}" }
    expected_status: [200]
    expected_response:
      content_type: application/json
      type: object
      required_fields: [id, status, approvedAt]
      values: { status: approved }

  - id: event_export_csv
    name: Утверждённый заказ для кухни в CSV
    required: true
    method: GET
    path: /events/{eventId}/export.csv
    role: organizer
    params:
      path: { eventId: "{{eventId}}" }
      headers: { Authorization: "Bearer {{organizerToken}}" }
    expected_status: [200]
    expected_response:
      content_type: text/csv
      body_contains: [Блюдо, "{{data.selectionNotes}}"]

  # --- Администратор ресторана ---
  - id: kitchen_board
    name: Раздел «Кухня» со всеми банкетами ресторана
    required: true
    method: GET
    path: /kitchen
    role: restaurant
    params:
      headers: { Authorization: "Bearer {{adminToken}}" }
    expected_status: [200]
    expected_response:
      content_type: application/json
      type: array
      min_items: 1
      required_fields: [event.id, event.ownerName, summary, shared, guests]

  - id: kitchen_forbidden_for_organizer
    name: Организатору раздел «Кухня» недоступен
    required: true
    method: GET
    path: /kitchen
    role: organizer
    params:
      headers: { Authorization: "Bearer {{organizerToken}}" }
    expected_status: [403]
    expected_response:
      content_type: application/json
      type: object
      required_fields: [error]

  - id: kitchen_export_xlsx
    name: Выгрузка кухни в Excel
    required: true
    method: GET
    path: /kitchen/export
    role: restaurant
    params:
      query: { format: xlsx }
      headers: { Authorization: "Bearer {{adminToken}}" }
    expected_status: [200]
    expected_response:
      content_type: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      min_bytes: 1000

  - id: kitchen_export_csv
    name: Выгрузка кухни в CSV
    required: true
    method: GET
    path: /kitchen/export
    role: restaurant
    params:
      query: { format: csv }
      headers: { Authorization: "Bearer {{adminToken}}" }
    expected_status: [200]
    expected_response:
      content_type: text/csv
      body_contains: [Порции]

  - id: menu_item_create
    name: Администратор добавляет блюдо со стоимостью, составом, КБЖУ и аллергенами
    required: true
    method: POST
    path: /restaurants/{restaurantId}/menu
    role: restaurant
    params:
      path: { restaurantId: "{{restaurantId}}" }
      headers: { Authorization: "Bearer {{adminToken}}" }
      body: "{{data.menuItem}}"
    expected_status: [201]
    expected_response:
      content_type: application/json
      type: object
      required_fields: [id, name, price, ingredients, allergens, nutrition.kcal, nutrition.protein, nutrition.fat, nutrition.carbs]
      values: { price: 45000, ingredients: "{{data.menuItem.ingredients}}" }

  - id: menu_item_forbidden_for_organizer
    name: Организатор не редактирует меню ресторана
    required: true
    method: POST
    path: /restaurants/{restaurantId}/menu
    role: organizer
    params:
      path: { restaurantId: "{{restaurantId}}" }
      headers: { Authorization: "Bearer {{organizerToken}}" }
      body: "{{data.menuItem}}"
    expected_status: [403]
    expected_response:
      content_type: application/json
      type: object
      required_fields: [error]

  - id: users
    name: Администратор видит пользователей и их роли
    required: true
    method: GET
    path: /users
    role: restaurant
    params:
      headers: { Authorization: "Bearer {{adminToken}}" }
    expected_status: [200]
    expected_response:
      content_type: application/json
      type: array
      min_items: 1
      required_fields: [id, name, roles, isYou]
