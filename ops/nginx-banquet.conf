# Include this fragment INSIDE the existing HTTPS server block for
# mail.lonelycraft.ru. Keep the existing Mailu locations and certificates.

location = /banquet {
    return 308 /banquet/$is_args$args;
}

location ^~ /banquet/ {
    proxy_pass http://127.0.0.1:3100/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /banquet;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_redirect off;
    client_max_body_size 1m;
}
