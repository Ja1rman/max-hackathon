name: Checks

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_BASE_PATH: /banquet/
      - name: Check deployment shell scripts
        run: bash -n scripts/deploy.sh scripts/backup.sh
      - name: Test MAX configuration synchronization
        run: python3 -B -m unittest discover -s tests -p 'test_sync_max_env.py'
