      summary: Полностью заменить собственный выбор
      description: До дедлайна, только collecting. В live нужен свой подтверждённый
        номер из списка приглашённых; организатор-владелец может выбрать блюда для себя без
        записи в списке и присоединяется автоматически.
        Обновление транзакционное, revision увеличивается,
        цена берётся из event_menu. Позиции с forGuests=false и позиции общего стола
        выбрать нельзя (400). Блюда дороже foodBudget или напитки дороже drinkBudget
        отклоняются (409); лимиты независимы.
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
