---
openapi: 3.1.0
info:
  title: За столом — API
  version: 1.9.0
  description: 'Контракт server/index.mjs и server/store.mjs. JSON без envelope: списки
    — массивы; ошибки — {error:string}. Все деньги JSON API в целых копейках. JSON-тела
    <=65536 байт. POST /api/auth/*: максимум 180 запросов за 10 минут на IP; TRUST_PROXY=true
    доверяет X-Real-IP только за настроенным reverse proxy. Неизвестные JSON-поля
    не назначают роли, цену или scope. Отсутствуют отмена, reopen, оплата
    и интеграции POS. Публичный server URL — назначение развёртывания, не заявление
    о его готовности.'
servers:
- url: https://mail.lonelycraft.ru/banquet
  description: Назначение production через nginx, который удаляет /banquet
- url: http://localhost:3100
  description: Локальный Docker Compose
- url: http://localhost:3000
  description: Прямой Node.js backend
security:
- SessionBearer: []
paths:
  "/healthz":
    get:
      operationId: health
      summary: Проверка процесса и SQLite
      description: ''
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Health"
        '500':
          "$ref": "#/components/responses/500"
      security: []
  "/api/config":
    get:
      operationId: config
      summary: Публичная конфигурация интерфейса
      description: ''
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Config"
        '500':
          "$ref": "#/components/responses/500"
      security: []
  "/api/auth/max":
    post:
      operationId: loginMax
      summary: Обмен подписанных данных MAX на сессию
      description: HMAC-SHA256 по алгоритму MAX; auth_date не старше часа и не более
        30 секунд в будущем. Глобальные администраторы определяются по RESTAURANT_ADMIN_IDS
        и таблице global_admins; администраторы ресторанов — из restaurant_members, организаторы — из прав конкретных банкетов.
        Live-сессия 7 суток; не более 10 активных сессий на пользователя.
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Session"
        '400':
          "$ref": "#/components/responses/400"
        '401':
          "$ref": "#/components/responses/401"
        '413':
          "$ref": "#/components/responses/413"
        '415':
          "$ref": "#/components/responses/415"
        '429':
          "$ref": "#/components/responses/429"
        '503':
          "$ref": "#/components/responses/503"
        '500':
          "$ref": "#/components/responses/500"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/MaxLogin"
      security: []
  "/api/auth/demo":
    post:
      operationId: loginDemo
      summary: Создать демо, сменить роль или войти по демо-приглашению
      description: Без sandbox создаётся отдельный scope с синтетическими данными.
        С sandbox выбирается роль в своём демо. inviteCode без sandbox создаёт только
        guest в scope приглашения, игнорируя запрошенные привилегии; live-приглашение
        даёт 403. Демо-сессия 24 часа, scope хранится 7 суток. Не более MAX_DEMO_SPACES
        (по умолчанию 1000) demo scope. DEMO_ENABLED=false также отзывает существующие
        демо-сессии и скрывает публичные демо-приглашения.
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/DemoSession"
        '400':
          "$ref": "#/components/responses/400"
        '401':
          "$ref": "#/components/responses/401"
        '403':
          "$ref": "#/components/responses/403"
        '404':
          "$ref": "#/components/responses/404"
        '409':
          "$ref": "#/components/responses/409"
        '413':
          "$ref": "#/components/responses/413"
        '415':
          "$ref": "#/components/responses/415"
        '429':
          "$ref": "#/components/responses/429"
        '500':
          "$ref": "#/components/responses/500"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/DemoLogin"
      security: []
  "/api/max/webhook":
    post:
      operationId: maxWebhook
      summary: Принять событие MAX и ответить ссылкой Mini App
      description: Проверка секрета до чтения тела. Persistent claim перед ответом
        обеспечивает не более одной попытки welcome на событие. Тайм-аут MAX API 8
        секунд; ошибка доставки после claim подтверждается 200 без автоматической
        повторной отправки.
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/WebhookAck"
        '400':
          "$ref": "#/components/responses/400"
        '401':
          "$ref": "#/components/responses/401"
        '413':
          "$ref": "#/components/responses/413"
        '415':
          "$ref": "#/components/responses/415"
        '503':
          "$ref": "#/components/responses/503"
        '500':
          "$ref": "#/components/responses/500"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/MaxUpdate"
      security:
      - MaxWebhookSecret: []
  "/api/invites/{code}":
    get:
      operationId: previewInvite
      summary: Посмотреть сведения и снимок меню по приглашению
      description: 'Публично: основные сведения мероприятия и меню. Имена, пожелания,
        бюджет, сумма и сводка участников отсутствуют. Просмотр доступен и после закрытия
        сбора, пока мероприятие существует.'
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/InvitePreview"
        '404':
          "$ref": "#/components/responses/404"
        '500':
          "$ref": "#/components/responses/500"
      security: []
      parameters:
      - "$ref": "#/components/parameters/code"
  "/api/me":
    get:
      operationId: me
      summary: Текущий пользователь
      description: ''
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/User"
        '401':
          "$ref": "#/components/responses/401"
        '500':
          "$ref": "#/components/responses/500"
  "/api/me/phone":
    put:
      operationId: verifyPhone
      summary: Привязать подтверждённый номер телефона MAX к текущей сессии
      description: Тело — результат window.WebApp.requestContact(). Сервер проверяет HMAC-SHA256 токеном бота, свежесть authDate и userId из подписанной MAX-сессии; присланный клиентом userId не принимается. Номер нормализуется в международный формат без плюса. Демо-сессии запрещены.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/MaxContact"
      responses:
        '200':
          description: Обновлённый профиль
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/User"
        '400':
          "$ref": "#/components/responses/400"
        '401':
          "$ref": "#/components/responses/401"
        '403':
          "$ref": "#/components/responses/403"
        '409':
          "$ref": "#/components/responses/409"
  "/api/me/claim-invitations":
    post:
      operationId: claimMyInvitations
      summary: Найти и принять приглашения по подтверждённому номеру MAX
      description: Для общей кнопки бота, которая не передаёт код банкета. Требует подпись MAX для номера через PUT /api/me/phone. Находит только записи текущего номера, закрепляет их за текущим MAX ID и возвращает доступные eventId. Повторный вызов безопасен. Закрытые банкеты без ранее принятого приглашения пропускаются.
      responses:
        '200':
          description: Доступные банкеты гостя
          content:
            application/json:
              schema:
                type: object
                properties:
                  eventIds:
                    type: array
                    items: { type: string }
                required: [eventIds]
        '401':
          "$ref": "#/components/responses/401"
        '403':
          "$ref": "#/components/responses/403"
  "/api/me/notifications":
    put:
      operationId: setNotifications
      summary: Включить или выключить уведомления в MAX
      description: Доставка возможна только после начала личного диалога с ботом. По умолчанию выключено; bot_stopped отключает фактическую отправку.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
      responses:
        '200':
          description: Обновлённый профиль
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/User"
        '400':
          "$ref": "#/components/responses/400"
        '401':
          "$ref": "#/components/responses/401"
        '403':
          "$ref": "#/components/responses/403"
  "/api/media":
    post:
      operationId: uploadPhoto
      summary: Загрузить фото для блюда или напитка
      description: Авторизованный пользователь. Бинарное тело до 3 МиБ, проверяется сигнатура формата. Возвращённый photoUrl передаётся при создании или правке блюда или банкета.
      requestBody:
        required: true
        content:
          image/jpeg:
            schema: { type: string, format: binary }
          image/png:
            schema: { type: string, format: binary }
          image/webp:
            schema: { type: string, format: binary }
      responses:
        '201':
          description: Путь к загруженному фото
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PhotoUpload"
        '401':
          "$ref": "#/components/responses/401"
        '403':
          "$ref": "#/components/responses/403"
        '413':
          "$ref": "#/components/responses/413"
        '415':
          "$ref": "#/components/responses/415"
  "/api/media/{fileName}":
    get:
      operationId: getPhoto
      summary: Получить публичное фото блюда
      security: []
      parameters:
      - "$ref": "#/components/parameters/fileName"
      responses:
        '200':
          description: JPEG, PNG или WebP
        '404':
          "$ref": "#/components/responses/404"
  "/api/restaurants":
    get:
      operationId: restaurants
      summary: Рестораны и текущий каталог своего scope
      description: Все роли видят каталог только своего scope. sampleMenu обозначает
        пример каталога и сбрасывается при первой его правке.
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/Restaurant"
        '401':
          "$ref": "#/components/responses/401"
        '500':
          "$ref": "#/components/responses/500"
    post:
      operationId: createRestaurant
      summary: Добавить ресторан
      description: Только суперадминистратор (RESTAURANT_ADMIN_IDS). Меню нового ресторана пустое.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/RestaurantInput"
      responses:
        '201':
          description: Создан
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Restaurant"
        '400':
          "$ref": "#/components/responses/400"
        '401':
          "$ref": "#/components/responses/401"
        '403':
          "$ref": "#/components/responses/403"
        '429':
          "$ref": "#/components/responses/429"
  "/api/restaurants/{restaurantId}":
    patch:
      operationId: editRestaurant
      summary: Изменить название, адрес или описание ресторана
      description: Администратор этого ресторана.
      parameters:
      - "$ref": "#/components/parameters/restaurantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/RestaurantInput"
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Restaurant"
        '400':
          "$ref": "#/components/responses/400"
        '401':
          "$ref": "#/components/responses/401"
        '403':
          "$ref": "#/components/responses/403"
        '404':
          "$ref": "#/components/responses/404"
  "/api/restaurants/{restaurantId}/favorite":
    put:
      operationId: addRestaurantFavorite
      summary: Добавить ресторан в личное избранное
      parameters:
      - "$ref": "#/components/parameters/restaurantId"
      responses:
        '200': { description: Состояние избранного текущего пользователя }
        '401': { "$ref": "#/components/responses/401" }
        '404': { "$ref": "#/components/responses/404" }
    delete:
      operationId: removeRestaurantFavorite
      summary: Убрать ресторан из личного избранного
      parameters:
      - "$ref": "#/components/parameters/restaurantId"
      responses:
        '200': { description: Состояние избранного текущего пользователя }
        '401': { "$ref": "#/components/responses/401" }
        '404': { "$ref": "#/components/responses/404" }
  "/api/restaurants/{restaurantId}/members":
    get:
      operationId: listRestaurantMembers
      summary: Назначенные роли в ресторане
      description: Доступно глобальному администратору и администратору этого ресторана.
      parameters:
      - "$ref": "#/components/parameters/restaurantId"
      responses:
        '200':
          description: Список назначенных ролей
          content:
            application/json:
              schema:
                type: array
                items: { "$ref": "#/components/schemas/RestaurantMember" }
        '403': { "$ref": "#/components/responses/403" }
  "/api/admins/{userId}":
    put:
      operationId: setGlobalAdmin
      summary: Назначить или снять глобального администратора
      description: Только действующий глобальный администратор. userId из /api/users либо числовой MAX ID. Нельзя снять собственную или закреплённую на сервере роль.
      parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '200': { description: Текущая глобальная роль пользователя }
        '403': { "$ref": "#/components/responses/403" }
        '409': { "$ref": "#/components/responses/409" }
  "/api/restaurants/{restaurantId}/packages":
    post:
      operationId: createRestaurantPackage
      summary: Создать фиксированный пакет ресторана
      parameters:
      - "$ref": "#/components/parameters/restaurantId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { "$ref": "#/components/schemas/PackageInput" }
      responses:
        '201':
          description: Созданный пакет
          content:
            application/json:
              schema: { "$ref": "#/components/schemas/Package" }
        '403': { "$ref": "#/components/responses/403" }
  "/api/restaurants/{restaurantId}/packages/{packageId}":
    patch:
      operationId: updateRestaurantPackage
      summary: Изменить пакет ресторана
      parameters:
      - "$ref": "#/components/parameters/restaurantId"
      - name: packageId
        in: path
        required: true
        schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { "$ref": "#/components/schemas/PackageInput" }
      responses:
        '200':
          description: Обновлённый пакет
          content:
            application/json:
              schema: { "$ref": "#/components/schemas/Package" }
        '403': { "$ref": "#/components/responses/403" }
    delete:
      operationId: deleteRestaurantPackage
      summary: Удалить пакет из каталога ресторана
      parameters:
      - "$ref": "#/components/parameters/restaurantId"
      - name: packageId
        in: path
        required: true
        schema: { type: string }
      responses:
        '200': { description: Пакет удалён }
        '403': { "$ref": "#/components/responses/403" }
  "/api/restaurants/{restaurantId}/members/{userId}":
    put:
      operationId: setRestaurantMember
      summary: Выдать пользователю роль в ресторане
      description: userId из /api/users либо числовой MAX ID. Глобальный администратор
        назначает администратора ресторана. Организаторы назначаются на конкретный банкет через /api/events/{eventId}/organizers/{identity}. none убирает доступ; свою роль изменить нельзя (409).
      parameters:
      - "$ref": "#/components/parameters/restaurantId"
      - name: userId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  enum: [admin, none]
      responses:
        '200':
          description: Успешно
        '400':
          "$ref": "#/components/responses/400"
        '401':
          "$ref": "#/components/responses/401"
        '403':
          "$ref": "#/components/responses/403"
        '404':
          "$ref": "#/components/responses/404"
        '409':
          "$ref": "#/components/responses/409"
    delete:
      operationId: deleteRestaurantMember
      summary: Снять роль в ресторане
      description: Эквивалент PUT с {role:none}; администратор ресторана не может снять другого администратора.
      parameters:
      - "$ref": "#/components/parameters/restaurantId"
      - name: userId
        in: path
        required: true
        schema: { type: string }
      responses:
        '200': { description: Роль снята }
        '403': { "$ref": "#/components/responses/403" }
  "/api/users":
    get:
      operationId: listUsers
      summary: Только участники доступных банкетов и администраторы доступных ресторанов
      description: Доступно организатору банкета или администратору ресторана. Пользователи вне их банкетов и ресторанов скрыты. До 200 записей.
      parameters:
      - name: q
        in: query
        required: false
        description: Часть имени, цифры телефона или точный MAX ID.
        schema:
          type: string
          maxLength: 80
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/ManagedUser"
        '401':
          "$ref": "#/components/responses/401"
        '403':
          "$ref": "#/components/responses/403"
  "/api/events":
    get:
      operationId: events
      summary: Доступные текущему пользователю банкеты
      description: Владелец, участник или ресторанная роль в том же scope. Сортировка
        created_at DESC; без пагинации.
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/Event"
        '401':
          "$ref": "#/components/responses/401"
        '500':
          "$ref": "#/components/responses/500"
    post:
      operationId: createEvent
      summary: Создать банкет и снимок доступного меню
      description: Organizer или restaurant. Создание события и event_menu в транзакции. Не
        более 30 событий на демо-организатора или 500 на live-организатора.
      responses:
        '201':
          description: Успешно
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Event"
        '400':
          "$ref": "#/components/responses/400"
        '401':
          "$ref": "#/components/responses/401"
        '403':
          "$ref": "#/components/responses/403"
        '409':
          "$ref": "#/components/responses/409"
        '413':
          "$ref": "#/components/responses/413"
        '415':
          "$ref": "#/components/responses/415"
        '429':
          "$ref": "#/components/responses/429"
        '500':
          "$ref": "#/components/responses/500"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/EventCreate"
  "/api/events/{eventId}":
    get:
      operationId: event
      summary: Банкет, персональный выбор и разрешённая сводка
      description: ''
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/EventDetail"
        '401':
          "$ref": "#/components/responses/401"
        '404':
          "$ref": "#/components/responses/404"
        '500':
          "$ref": "#/components/responses/500"
      parameters:
      - "$ref": "#/components/parameters/eventId"
    patch:
      operationId: editEvent
      summary: Изменить дату, дедлайн, название, число гостей или бюджет
      description: Владелец или ресторан, пока заказ collecting. expectedRevision обязателен; при конкурирующем изменении возвращается 409. Число гостей не может быть меньше длины списка приглашённых.
      parameters:
      - "$ref": "#/components/parameters/eventId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/EventPatch"
      responses:
        '200':
          description: Обновлённый банкет
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Event"
        '400':
          "$ref": "#/components/responses/400"
        '401':
          "$ref": "#/components/responses/401"
        '403':
          "$ref": "#/components/responses/403"
        '409':
