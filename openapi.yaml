      type: object
      required: [itemIds]
      properties:
        itemIds:
          type: array
          minItems: 1
          maxItems: 500
          items: { type: string }
    CatalogSelection:
      type: object
      required: [itemIds]
      properties:
        itemIds:
          type: array
          maxItems: 500
          uniqueItems: true
          items: { type: string }
    MenuImported:
      type: object
      required: [added]
      properties:
        added: { type: integer, minimum: 0 }
    KitchenEntry:
      type: object
      required: [event, summary, shared, guests]
      properties:
        event:
          "$ref": "#/components/schemas/Event"
        summary:
          type: array
          description: Порции по блюдам, включая общий стол.
          items:
            "$ref": "#/components/schemas/SummaryItem"
        shared:
          type: array
          items:
            "$ref": "#/components/schemas/SharedItem"
        guests:
          type: array
          description: Гости с сохранённым выбором.
          items:
            type: object
            properties:
              name: { type: string }
              notes: { type: string }
              seat: { type: string }
              items:
                type: array
                items:
                  type: object
                  properties:
                    name: { type: string }
                    quantity: { type: integer }
    RestaurantInput:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        address: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 500 }
    RestaurantMember:
      type: object
      properties:
        userId: { type: string }
        maxId: { type: [string, 'null'] }
        name: { type: string }
        role: { type: string, enum: [admin] }
      required: [userId, maxId, name, role]
    ManagedUser:
      type: object
      required: [id, name, maxId, phone, superAdmin, fixed, isYou, roles]
      properties:
        id: { type: string }
        name: { type: string }
        maxId: { type: [string, 'null'] }
        phone: { type: [string, 'null'], description: Только подтверждённый номер. }
        superAdmin: { type: boolean }
        fixed: { type: boolean, description: Роль нельзя изменить (суперадминистратор или демо-организатор). }
        isYou: { type: boolean }
        eventRoles:
          type: object
          description: eventId → есть ли право организатора на доступный банкет.
          additionalProperties: { type: boolean }
        roles:
          type: object
          description: restaurantId → admin | none для доступных ресторанов.
          additionalProperties:
            type: string
            enum: [admin, none]
    ExportLink:
      type: object
      required:
      - url
      properties:
        url:
          type: string
          format: uri
          description: Одноразовая capability на 60 секунд; не логировать и не публиковать.
  responses:
    '400':
      description: Некорректные данные, JSON или отсутствие expectedRevision.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    '401':
      description: Отсутствует/истекла сессия, неверная MAX-подпись, sandbox либо
        webhook secret.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    '403':
      description: Недостаточно прав или другой scope.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    '404':
      description: Ресурс не найден, недоступен пользователю либо демо отключено.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    '409':
      description: Состояние заказа не допускает действие, дедлайн истёк, нет блюд/ответов
        или устарела ревизия.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    '413':
      description: JSON-тело превышает 65536 байт.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    '415':
      description: 'Ожидается Content-Type: application/json.'
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    '429':
      description: Лимит входов, демо-пространств, банкетов либо блюд превышен.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    '500':
      description: Внутренняя ошибка; технические детали не возвращаются клиенту.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    '503':
      description: MAX не настроен либо хранилище дедупликации временно недоступно.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
