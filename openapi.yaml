  "/api/kitchen/export":
    get:
      operationId: exportKitchen
      summary: Выгрузить раздел «Кухня» в Excel или CSV
      description: Администратор. XLSX содержит листы «Порции», «Гости», «Рассадка» и «Пакеты»; CSV — те же блоки подряд, с защитой от формул. Без eventIds выгружаются все доступные банкеты.
      parameters:
      - name: format
        in: query
        required: false
        schema:
          type: string
          enum: [xlsx, csv]
          default: csv
      - name: eventIds
        in: query
        required: false
        description: От 1 до 100 доступных ID, через запятую.
        schema: { type: string }
      responses:
        '200':
          description: Файл
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
            text/csv:
              schema:
                type: string
        '400':
          "$ref": "#/components/responses/400"
        '401':
          "$ref": "#/components/responses/401"
        '403':
          "$ref": "#/components/responses/403"
