      parameters:
      - "$ref": "#/components/parameters/restaurantId"
      - "$ref": "#/components/parameters/itemId"
    delete:
      operationId: deleteCatalogMenuItem
      summary: Удалить позицию общего каталога ресторана
      description: Только restaurant. Меню уже созданных банкетов не меняется.
      parameters:
      - "$ref": "#/components/parameters/restaurantId"
      - "$ref": "#/components/parameters/itemId"
      responses:
        '200':
          description: "{success:true}"
        '403':
          "$ref": "#/components/responses/403"
        '404':
          "$ref": "#/components/responses/404"
  "/api/events/{eventId}/export.csv":
    get:
      operationId: exportCsv
      summary: Скачать утверждённый заказ для кухни
      description: 'Только owner или restaurant того же scope, статус approved. UTF-8
        BOM, разделитель ;, CRLF. Секции: банкет/дата, суммарные количества/суммы,
        позиции по гостям с пожеланиями. CSV суммы в рублях с 2 знаками; формулы в
        текстовых полях нейтрализуются.'
      responses:
        '200':
          description: CSV-файл
          headers:
            Content-Disposition:
              schema:
                type: string
              example: attachment; filename="banquet-kitchen.csv"
          content:
            text/csv:
              schema:
                type: string
        '401':
          "$ref": "#/components/responses/401"
        '403':
          "$ref": "#/components/responses/403"
        '404':
          "$ref": "#/components/responses/404"
        '409':
          "$ref": "#/components/responses/409"
        '500':
          "$ref": "#/components/responses/500"
      parameters:
      - "$ref": "#/components/parameters/eventId"
  "/api/events/{eventId}/export-link":
    post:
      operationId: createExportLink
      summary: Создать одноразовую ссылку CSV для MAX Bridge
      description: Bearer owner/restaurant, только approved. Тело не требуется. TTL60
        секунд, одна действующая ссылка на user/event; новая заменяет старую. Передать
        url в WebApp.downloadFile(url, filename) по пользовательскому клику.
      parameters:
      - "$ref": "#/components/parameters/eventId"
      responses:
        '200':
          description: Одноразовая ссылка
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ExportLink"
        '401':
          "$ref": "#/components/responses/401"
        '403':
          "$ref": "#/components/responses/403"
        '404':
          "$ref": "#/components/responses/404"
        '409':
          "$ref": "#/components/responses/409"
        '500':
          "$ref": "#/components/responses/500"
  "/api/downloads/{downloadToken}":
    get:
      operationId: consumeExportLink
      summary: Однократно скачать CSV по короткоживущей ссылке
      description: 'Без Bearer: token в пути является capability. Проверяются срок,
        действующая роль владельца, scope, approved и revision. Ссылка расходуется
        атомарно; неизвестная, использованная, истёкшая или отозванная возвращает404.
        Cache-Control private,no-store; Referrer-Policy no-referrer.'
      security: []
      parameters:
      - "$ref": "#/components/parameters/downloadToken"
      responses:
        '200':
          description: CSV-файл
          headers:
            Content-Disposition:
              schema:
                type: string
              example: attachment; filename="banquet-kitchen.csv"
          content:
            text/csv:
              schema:
                type: string
        '404':
          "$ref": "#/components/responses/404"
        '500':
          "$ref": "#/components/responses/500"
  "/api/restaurants/{restaurantId}/halls":
    post:
      operationId: createHall
      summary: Добавить зал и окна бронирования
      parameters: [{ "$ref": "#/components/parameters/restaurantId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { "$ref": "#/components/schemas/HallInput" }
      responses:
        '201': { description: Зал создан }
        '403': { "$ref": "#/components/responses/403" }
        '409': { "$ref": "#/components/responses/409" }
  "/api/restaurants/{restaurantId}/halls/{hallId}":
    parameters:
    - { "$ref": "#/components/parameters/restaurantId" }
    - { name: hallId, in: path, required: true, schema: { type: string } }
    patch:
      operationId: updateHall
      summary: Изменить зал и окна бронирования
      requestBody:
        required: true
        content:
          application/json:
            schema: { "$ref": "#/components/schemas/HallInput" }
      responses:
        '200': { description: Зал обновлён }
        '409': { "$ref": "#/components/responses/409" }
    delete:
      operationId: deleteHall
      summary: Удалить зал без банкетов
      responses:
        '200': { description: Зал удалён }
        '409': { "$ref": "#/components/responses/409" }
  "/api/restaurants/{restaurantId}/availability":
    get:
      operationId: hallAvailability
      summary: Окна и занятые интервалы залов на дату
      parameters:
      - { "$ref": "#/components/parameters/restaurantId" }
      - { name: date, in: query, required: true, schema: { type: string, format: date } }
      - { name: hallId, in: query, required: false, schema: { type: string } }
      responses:
        '200': { description: Список залов с windows и booked; чужие брони содержат только start и end, свои также eventId }
  "/api/restaurants/{restaurantId}/availability/month":
    get:
      operationId: hallAvailabilityMonth
      summary: Свободные слоты начала банкета на месяц с шагом 30 минут
      parameters:
      - { "$ref": "#/components/parameters/restaurantId" }
      - { name: month, in: query, required: true, schema: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$' } }
      - { name: hallId, in: query, required: true, schema: { type: string } }
      - { name: durationHours, in: query, required: true, schema: { type: integer, minimum: 1, maximum: 12 } }
      - { name: excludeEventId, in: query, required: false, schema: { type: string }, description: Исключить свою бронь при редактировании; доступно только управляющему банкетом }
      responses:
        '200': { description: "Объект month, hallId, durationHours, days; каждый день содержит date и массив доступных часов HH:mm по Москве" }
        '403': { "$ref": "#/components/responses/403" }
  "/api/restaurants/{restaurantId}/package-dishes":
    post:
      operationId: createPackageDish
      summary: Создать блюдо только для пакетных предложений
      parameters: [{ "$ref": "#/components/parameters/restaurantId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { "$ref": "#/components/schemas/PackageDishInput" }
      responses:
        '201': { description: Блюдо создано }
        '403': { "$ref": "#/components/responses/403" }
  "/api/restaurants/{restaurantId}/package-dishes/{dishId}":
    parameters:
    - { "$ref": "#/components/parameters/restaurantId" }
    - { name: dishId, in: path, required: true, schema: { type: string } }
    patch:
      operationId: updatePackageDish
      summary: Изменить блюдо пакетного предложения
      requestBody:
        required: true
        content:
          application/json:
            schema: { "$ref": "#/components/schemas/PackageDishInput" }
      responses:
        '200': { description: Блюдо обновлено }
    delete:
      operationId: deletePackageDish
      summary: Удалить неиспользуемое блюдо пакета
      responses:
        '200': { description: Блюдо удалено }
        '409': { "$ref": "#/components/responses/409" }
  "/api/events/{eventId}/organizers":
    get:
      operationId: eventOrganizers
      summary: Организаторы конкретного банкета
      parameters: [{ "$ref": "#/components/parameters/eventId" }]
      responses:
        '200': { description: Список создателя и назначенных организаторов }
  "/api/events/{eventId}/organizers/{identity}":
    parameters:
    - { "$ref": "#/components/parameters/eventId" }
    - { name: identity, in: path, required: true, schema: { type: string }, description: "ID пользователя, max:ID или phone:номер" }
    put:
      operationId: setEventOrganizer
      summary: Назначить или снять организатора банкета
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [enabled], properties: { enabled: { type: boolean } } }
      responses:
        '200': { description: Права обновлены }
        '403': { "$ref": "#/components/responses/403" }
    delete:
      operationId: deleteEventOrganizer
      summary: Снять организатора банкета
      responses:
        '200': { description: Права сняты }
        '409': { "$ref": "#/components/responses/409" }
components:
  securitySchemes:
    SessionBearer:
      type: http
      scheme: bearer
      description: Токен приложения из /api/auth/max или /api/auth/demo, не MAX_BOT_TOKEN.
    MaxWebhookSecret:
      type: apiKey
      in: header
      name: X-Max-Bot-Api-Secret
  parameters:
    code:
      name: code
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]{24}$"
    eventId:
      name: eventId
      in: path
      required: true
      schema:
        type: string
    restaurantId:
      name: restaurantId
      in: path
      required: true
      schema:
        type: string
    itemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
    downloadToken:
      name: downloadToken
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]{43}$"
    guestId:
      name: guestId
      in: path
      required: true
      schema:
        type: string
    fileName:
      name: fileName
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-f0-9-]{36}\\.(jpg|png|webp)$"
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
      required:
      - error
    Health:
      type: object
      properties:
        status:
          type: string
          enum:
          - ok
      required:
      - status
    Config:
      type: object
      properties:
        demoEnabled:
          type: boolean
        maxConfigured:
          type: boolean
          description: Наличие MAX_BOT_TOKEN; не доказывает доступность webhook, модерацию
            или правильность токена.
        botUsername:
          type: string
      required:
      - demoEnabled
      - maxConfigured
      - botUsername
    User:
      type: object
      properties:
        id:
          type: string
          description: Непрозрачный идентификатор из ответа API; не интерпретировать
            как UUID без префикса.
        name:
          type: string
          maxLength: 160
        role:
          type: string
          enum:
          - organizer
          - guest
          - restaurant
          - admin
        maxId:
          type: [string, 'null']
          description: Числовой MAX ID; null в демонстрации.
        demo:
          type: boolean
        phoneVerified:
          type: boolean
        phone:
          type: [string, 'null']
          description: Только собственный подтверждённый номер в международном формате без плюса.
        notificationsEnabled:
          type: boolean
        access:
          type: array
          items:
            type: object
            properties:
              restaurantId: { type: string }
              restaurantName: { type: string }
              role: { type: string, enum: [admin] }
        superAdmin:
          type: boolean
        botConnected:
          type: boolean
          description: Пользователь открыл чат с ботом — уведомления могут быть доставлены.
      required:
      - id
      - name
      - maxId
      - role
      - demo
      - phoneVerified
      - phone
      - notificationsEnabled
    Session:
      type: object
      properties:
        token:
          type: string
          description: Bearer-секрет приложения. Хранится в БД только в SHA-256; не
            токен MAX.
        user:
          "$ref": "#/components/schemas/User"
      required:
      - token
      - user
    DemoSession:
      allOf:
      - "$ref": "#/components/schemas/Session"
      - type: object
        properties:
          sandbox:
            type:
            - string
            - 'null'
            description: Секрет демо-пространства для переключения ролей; null при
              входе гостя по приглашению.
          eventId:
            type: string
            description: Непрозрачный идентификатор из ответа API; не интерпретировать
              как UUID без префикса.
        required:
        - sandbox
    MaxLogin:
      type: object
      properties:
        initData:
          type: string
          minLength: 1
          maxLength: 16384
          description: Исходная строка window.WebApp.initData без повторной JSON-сериализации
            вложенного user.
      required:
      - initData
    MaxContact:
      type: object
      description: Исходный результат window.WebApp.requestContact(); подпись проверяется сервером.
      properties:
        phone:
          type: string
        authDate:
          type: string
        hash:
          type: string
          pattern: "^[a-fA-F0-9]{64}$"
      required: [phone, authDate, hash]
    PhotoUpload:
      type: object
      properties:
        photoUrl:
          type: string
          pattern: "^/api/media/[a-f0-9-]{36}\\.(jpg|png|webp)$"
      required: [photoUrl]
    DemoLogin:
      type: object
      properties:
        role:
          type: string
          enum:
          - admin
          - organizer
          - guest
          - restaurant
          default: organizer
        sandbox:
          type: string
          maxLength: 128
          description: Для продолжения собственного демо. Не передавать null.
        inviteCode:
          type: string
          pattern: "^[A-Za-z0-9_-]{24}$"
        name:
          type: string
          maxLength: 80
          description: Имя нового демо-гостя по приглашению; по умолчанию Новый гость.
    MenuItem:
      type: object
      properties:
        id:
          type: string
          description: Непрозрачный идентификатор из ответа API; не интерпретировать
            как UUID без префикса.
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 500
        ingredients:
          type: string
          maxLength: 1000
          description: Состав позиции; пустая строка, если не указан.
        forGuests:
          type: boolean
          default: true
          description: В меню банкета — доступна ли позиция гостям для выбора. В общем
            каталоге не используется.
        category:
          type: string
          minLength: 1
          maxLength: 80
        price:
          type: integer
          minimum: 1
          maximum: 100000000
          description: Цена за порцию, целые копейки.
        weight:
          type: string
          maxLength: 40
        emoji:
          type: string
          maxLength: 12
        allergens:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 80
          maxItems: 20
        labels:
          "$ref": "#/components/schemas/MenuLabels"
        available:
          type: boolean
        vegetarian:
          type: boolean
        photoUrl:
          type: string
          description: Пустая строка либо URL из POST /api/media.
        nutrition:
          "$ref": "#/components/schemas/Nutrition"
      required:
      - id
      - name
      - description
      - category
      - price
      - weight
      - emoji
      - allergens
      - labels
      - available
      - vegetarian
    MenuLabels:
      type: array
      uniqueItems: true
      maxItems: 3
      items:
        type: string
        enum: [Халяль, Много белка, Мало калорий]
      description: Редактируемые пометки. «Халяль» указывается только после подтверждения рестораном.
    Nutrition:
      type: object
      description: Пищевая ценность одной указанной порции; тестовые значения ориентировочные.
      properties:
        kcal: { type: integer, minimum: 0, maximum: 10000 }
        protein: { type: number, minimum: 0, maximum: 1000, multipleOf: 0.1 }
        fat: { type: number, minimum: 0, maximum: 1000, multipleOf: 0.1 }
        carbs: { type: number, minimum: 0, maximum: 1000, multipleOf: 0.1 }
      required: [kcal, protein, fat, carbs]
    MenuItemCreate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 500
        ingredients:
          type: string
          maxLength: 1000
          description: Состав позиции; пустая строка, если не указан.
        forGuests:
          type: boolean
          default: true
          description: В меню банкета — доступна ли позиция гостям для выбора. В общем
            каталоге не используется.
        category:
          type: string
          minLength: 1
          maxLength: 80
        price:
          type: integer
          minimum: 1
          maximum: 100000000
          description: Цена за порцию, целые копейки.
        weight:
          type: string
          maxLength: 40
        emoji:
          type: string
          maxLength: 12
        allergens:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 80
          maxItems: 20
        labels:
          "$ref": "#/components/schemas/MenuLabels"
        available:
          type: boolean
        vegetarian:
          type: boolean
        photoUrl:
          type: string
        nutrition:
          "$ref": "#/components/schemas/Nutrition"
      required:
      - name
      - category
      - price
      - nutrition
      description: "Описание/вес по умолчанию пустые, emoji \U0001F37D️, available
        true, vegetarian false, allergens [], labels []."
    MenuItemPatch:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 500
        ingredients:
          type: string
          maxLength: 1000
          description: Состав позиции; пустая строка, если не указан.
        forGuests:
          type: boolean
          default: true
          description: В меню банкета — доступна ли позиция гостям для выбора. В общем
            каталоге не используется.
        category:
          type: string
          minLength: 1
          maxLength: 80
        price:
          type: integer
          minimum: 1
          maximum: 100000000
          description: Цена за порцию, целые копейки.
        weight:
          type: string
          maxLength: 40
        emoji:
          type: string
          maxLength: 12
        allergens:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 80
          maxItems: 20
        labels:
          "$ref": "#/components/schemas/MenuLabels"
        available:
          type: boolean
        vegetarian:
          type: boolean
        photoUrl:
          type: string
        nutrition:
          "$ref": "#/components/schemas/Nutrition"
      description: Частичная правка каталога; снимки меню существующих банкетов не
        изменяются.
    Restaurant:
      type: object
      properties:
        id:
          type: string
          description: Непрозрачный идентификатор из ответа API; не интерпретировать
            как UUID без префикса.
        name:
          type: string
        description:
          type: string
        address:
          type: string
        sampleMenu:
          type: boolean
        favorite:
          type: boolean
          description: Ресторан в избранном текущего пользователя.
        access:
          type: string
          enum: [admin]
          nullable: true
          description: Административный доступ к ресторану; null у гостя или организатора без роли. Каталог всех ресторанов доступен каждому вошедшему только для чтения.
        menu:
          type: array
          items:
            "$ref": "#/components/schemas/MenuItem"
        packageDishes:
          type: array
          items: { type: object, description: Блюдо только для пакетного предложения с КБЖУ и фото }
        halls:
          type: array
          items: { "$ref": "#/components/schemas/Hall" }
        packages:
          type: array
          items:
            "$ref": "#/components/schemas/Package"
      required:
      - id
      - name
      - description
      - address
      - sampleMenu
      - menu
      - packages
      - packageDishes
      - halls
    Hall:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        capacity: { type: integer }
        windows: { type: array, items: { type: object } }
        seatingConfig:
          "$ref": "#/components/schemas/SeatingConfig"
        allowedSeating: { type: array, deprecated: true, items: { type: string, enum: [choice, fixed] } }
        defaultSeatingTemplate: { type: string, enum: [rounds, u, presidium, t, long] }
        allowFreeSeating: { type: boolean, readOnly: true, description: Может ли организатор расставлять столы из набора ресторана. }
      required: [id, name, capacity, windows, seatingConfig, allowedSeating, defaultSeatingTemplate, allowFreeSeating]
    SeatingConfig:
      type: object
      description: 'fixed закрепляет расположение столов и стульев за рестораном, гости выбирают места; flexible позволяет организатору расставлять столы только из tablePresets. Конфигурация копируется в банкет при его создании.'
      required: [type, fixedLayout, tablePresets]
      properties:
        type: { type: string, enum: [fixed, flexible] }
        fixedLayout:
          "$ref": "#/components/schemas/SeatingLayout"
        tablePresets:
          type: array
          minItems: 1
          maxItems: 40
          uniqueItems: true
          items:
            type: object
            required: [shape, seats]
            properties:
              shape: { type: string, enum: [round, rect] }
              seats: { type: integer, minimum: 1, maximum: 40 }
    HallInput:
      type: object
      required: [name, capacity, windows]
      properties:
        name: { type: string, maxLength: 100 }
        capacity: { type: integer, minimum: 1, maximum: 1000 }
        windows:
          type: array
          minItems: 1
          maxItems: 28
          items:
            type: object
            required: [weekday, start, end]
            properties:
              weekday: { type: integer, minimum: 0, maximum: 6, description: Воскресенье = 0 }
              start: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$' }
              end: { type: string, pattern: '^(([01]\d|2[0-3]):[0-5]\d|24:00)$', description: '24:00 означает конец суток. Семь окон 00:00–24:00 задают круглосуточный режим.' }
        seatingConfig:
          "$ref": "#/components/schemas/SeatingConfig"
        allowedSeating: { type: array, deprecated: true, uniqueItems: true, items: { type: string, enum: [choice, fixed] }, description: 'Устаревший параметр для совместимости. Используйте seatingConfig.' }
        defaultSeatingTemplate: { type: string, deprecated: true, enum: [rounds, u, presidium, t, long], default: rounds, description: 'Устаревший шаблон для совместимости. Используйте seatingConfig.' }
    PackageDishInput:
      type: object
