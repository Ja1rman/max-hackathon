      operationId: joinInvite
      summary: Присоединить текущего пользователя к банкету
      description: Тело не требуется и не обрабатывается. Повтор для уже присоединившегося
        идемпотентен, в том числе после утверждения/дедлайна. В live требуется
        предварительно подтверждённый MAX номер. Если его ещё нет в списке,
        действительная ссылка создаёт собственную запись гостя. Новое присоединение
        только в открытый банкет своего scope, максимум 1000 участников.
      responses:
        '200':
          description: Успешно
          content:
