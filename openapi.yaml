        из личного диалога человека. Остальные корректные JSON-объекты подтверждаются
        200 и игнорируются.
      additionalProperties: true
    WebhookAck:
      type: object
      properties:
        ok:
          type: boolean
          const: true
        ignored:
          type: boolean
        duplicate:
          type: boolean
      required:
      - ok
    SeatingMode:
      type: string
      enum:
      - 'off'
      - choice
      - fixed
      description: off — только блюда; choice — гости выбирают места сами; fixed —
        места назначает организатор.
    SeatingTable:
      type: object
      properties:
        id:
          type: string
          pattern: "^[A-Za-z0-9_]{1,32}$"
        shape:
          type: string
          enum:
          - round
          - rect
        label:
          type: string
          minLength: 1
          maxLength: 24
          description: Число выводится как «Стол N», текст — как есть (например «Президиум»).
        x:
          type: number
        y:
          type: number
        w:
          type: number
          minimum: 40
          maximum: 1400
        h:
          type: number
          minimum: 40
          maximum: 1000
          description: Для круглого стола равна w.
        rotation:
          type: integer
          enum:
          - 0
          - 90
          - 180
          - 270
        seats:
          type: integer
          minimum: 0
          maximum: 40
        sides:
          type: array
          description: Только rect; стороны, где стоят стулья.
          items:
            type: string
            enum:
            - top
            - right
            - bottom
            - left
      required:
      - id
      - shape
      - label
      - x
      - y
      - w
      - h
      - seats
    SeatingLayout:
      type: object
      description: Стулья не хранятся; их id вида «<tableId>-<n>» и координаты вычисляются
        из стола функцией shared/seating.mjs. Не больше 150 столов и 1000 мест.
      properties:
        tables:
          type: array
          maxItems: 150
          items:
            "$ref": "#/components/schemas/SeatingTable"
      required:
      - tables
    SeatPerson:
      type: object
      properties:
        key:
          type: string
          description: invite:<id> для гостя из списка или user:<id> для гостя без записи в списке (демо-ссылка).
        name:
          type: string
        userId:
          type:
          - string
          - 'null'
        seatId:
          type:
          - string
          - 'null'
        source:
          type:
          - string
          - 'null'
          enum:
          - guest
          - admin
          - auto
          - null
      required:
      - key
      - name
      - seatId
    Seating:
      type: object
      properties:
        mode:
          "$ref": "#/components/schemas/SeatingMode"
        layout:
          "$ref": "#/components/schemas/SeatingLayout"
        seatCount:
          type: integer
        mySeat:
          type:
          - string
          - 'null'
        occupied:
          type: array
          items:
            type: string
        names:
          type: object
          description: Имена гостей на занятых местах, seatId → имя; видны всем участникам.
          additionalProperties:
            type: string
        people:
          type: array
          description: Только владелец и ресторан.
          items:
            "$ref": "#/components/schemas/SeatPerson"
      required:
      - mode
      - layout
      - seatCount
      - mySeat
      - occupied
      - names
    SeatingPut:
      type: object
      properties:
        mode:
          "$ref": "#/components/schemas/SeatingMode"
        layout:
          "$ref": "#/components/schemas/SeatingLayout"
    SeatChoice:
      type: object
      properties:
        seatId:
          type:
          - string
          - 'null'
      required:
      - seatId
    SeatAssignment:
      type: object
      properties:
        guest:
          type: string
          description: key из Seating.people.
        seatId:
          type:
          - string
          - 'null'
      required:
      - guest
      - seatId
    AutoSeatResult:
      type: object
      properties:
        assigned:
          type: integer
        unseated:
          type: integer
          description: Гостей, которым не хватило мест.
        seating:
          "$ref": "#/components/schemas/Seating"
      required:
      - assigned
      - unseated
      - seating
    SharedItem:
      type: object
      properties:
        menuItemId:
          type: string
        name:
          type: string
        quantity:
          type: integer
          minimum: 1
          maximum: 1000
        price:
          type: integer
          description: Цена из снимка меню, копейки.
        total:
          type: integer
      required: [menuItemId, name, quantity, price, total]
    SharedPut:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            type: object
            required: [menuItemId, quantity]
            properties:
              menuItemId: { type: string }
              quantity: { type: integer, minimum: 1, maximum: 1000 }
    SharedSaved:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            "$ref": "#/components/schemas/SharedItem"
    MenuImport:
      type: object
      required: [itemIds]
      properties:
        itemIds:
          type: array
          minItems: 1
          maxItems: 500
          items: { type: string }
    MenuImported:
      type: object
      required: [added]
      properties:
        added: { type: integer, minimum: 0 }
    KitchenEntry:
      type: object
      required: [event, summary, shared, guests]
      properties:
        event:
          "$ref": "#/components/schemas/Event"
        summary:
          type: array
          description: Порции по блюдам, включая общий стол.
          items:
            "$ref": "#/components/schemas/SummaryItem"
        shared:
          type: array
          items:
            "$ref": "#/components/schemas/SharedItem"
        guests:
          type: array
          description: Гости с сохранённым выбором.
          items:
            type: object
            properties:
              name: { type: string }
              notes: { type: string }
              seat: { type: string }
              items:
                type: array
                items:
                  type: object
                  properties:
                    name: { type: string }
                    quantity: { type: integer }
    RestaurantInput:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        address: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 500 }
    RestaurantMember:
      type: object
      properties:
        userId: { type: string }
        maxId: { type: [string, 'null'] }
        name: { type: string }
        role: { type: string, enum: [admin, organizer] }
      required: [userId, maxId, name, role]
    ManagedUser:
      type: object
      required: [id, name, maxId, phone, superAdmin, fixed, isYou, roles]
      properties:
        id: { type: string }
        name: { type: string }
        maxId: { type: [string, 'null'] }
        phone: { type: [string, 'null'], description: Только подтверждённый номер. }
        superAdmin: { type: boolean }
        fixed: { type: boolean, description: Роль нельзя изменить (суперадминистратор или демо-организатор). }
        isYou: { type: boolean }
        roles:
          type: object
          description: restaurantId → admin | organizer | none для ресторанов запрашивающего.
          additionalProperties:
            type: string
            enum: [admin, organizer, none]
    ExportLink:
      type: object
      required:
      - url
      properties:
        url:
          type: string
          format: uri
          description: Одноразовая capability на 60 секунд; не логировать и не публиковать.
  responses:
    '400':
      description: Некорректные данные, JSON или отсутствие expectedRevision.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    '401':
      description: Отсутствует/истекла сессия, неверная MAX-подпись, sandbox либо
        webhook secret.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    '403':
      description: Недостаточно прав или другой scope.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    '404':
      description: Ресурс не найден, недоступен пользователю либо демо отключено.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    '409':
      description: Состояние заказа не допускает действие, дедлайн истёк, нет блюд/ответов
        или устарела ревизия.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    '413':
      description: JSON-тело превышает 65536 байт.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    '415':
      description: 'Ожидается Content-Type: application/json.'
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    '429':
      description: Лимит входов, демо-пространств, банкетов либо блюд превышен.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    '500':
      description: Внутренняя ошибка; технические детали не возвращаются клиенту.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    '503':
      description: MAX не настроен либо хранилище дедупликации временно недоступно.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
